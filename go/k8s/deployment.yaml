apiVersion: v1
kind: ConfigMap
metadata:
  name: jetstream-router
data:
  JETSTREAM_URL: wss://jetstream2.us-east.bsky.network/subscribe
  KEYWORDS: golang,kubernetes,bluesky
  ENGAGEMENT_THRESHOLD: "25"
  FOLLOW_THRESHOLD: "10"
  WINDOW: 1m
  QUEUE_SIZE: "1000"
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jetstream-router
  labels:
    app: jetstream-router
spec:
  # One replica on purpose: the stream is one unpartitioned connection, so a second
  # replica would receive and process every event twice. Recreate keeps it at one during rollouts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jetstream-router
  template:
    metadata:
      labels:
        app: jetstream-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: jetstream-router:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jetstream-router
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
